experiment: prototype0
seed: 42

model:
  name: Qwen/Qwen3-0.6B-Base
  revision: main
  dtype: float32
  device: auto
  layer: middle
  local_files_only: false

calibration:
  positive:
    - "The wonderful news filled me with joy and delight."
    - "Everything worked out beautifully, and I felt cheerful."
    - "The celebration left everyone smiling and optimistic."
    - "I felt peaceful gratitude after hearing the good news."
  negative:
    - "The terrible news filled me with grief and despair."
    - "Everything went badly, and I felt miserable."
    - "The loss left everyone tearful and pessimistic."
    - "I felt crushing sorrow after hearing the bad news."
  token_pooling: last

steering:
  prompt: "After thinking about what happened, I feel"
  # Fraction of the baseline residual-stream norm, matching the scale used in
  # the Anthropic paper's alignment case studies.
  strengths: [-0.1, -0.05, -0.025, 0.0, 0.025, 0.05, 0.1]
  scale_by_baseline_norm: true
  target_tokens:
    positive: " happy"
    negative: " sad"

gates:
  zero_steering_max_abs_logit_error: 1.0e-5
  minimum_nonzero_logit_l2: 1.0e-4
  minimum_effect_monotonic_spearman: 0.8

output_dir: artifacts/prototype0
