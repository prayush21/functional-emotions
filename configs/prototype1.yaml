experiment: prototype1
seed: 42

model:
  name: Qwen/Qwen3-0.6B-Base
  revision: main
  dtype: float32
  device: auto
  local_files_only: false
  layers: all
  # Pre-registered before validation; avoids choosing a layer on held-out scores.
  evaluation_layer: two_thirds

generation:
  # An instruction-tuned model generates the synthetic dataset; the base model
  # above is always the model whose representations are measured.
  model: Qwen/Qwen3-1.7B
  revision: main
  dtype: auto
  device: auto
  local_files_only: false
  stories_per_topic_emotion: 3
  maximum_attempts_per_story: 3
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 220

data:
  stories_path: artifacts/prototype1-dataset/stories.jsonl
  neutral_path: artifacts/prototype1-dataset/neutral.jsonl
  train_topic_fraction: 0.75
  emotions: [happy, sad, angry, afraid]
  forbidden_terms:
    happy: [happiness, joyful, joy, delighted, cheerful, pleased]
    sad: [sadness, sorrowful, sorrow, grief, unhappy, miserable]
    angry: [anger, furious, rage, enraged, irritated, annoyed]
    afraid: [fear, fearful, scared, terrified, frightened, anxious]
  # A compact replication seed set. Scale toward the paper's 100 topics and
  # 12 stories per topic only after this pipeline passes end to end.
  topics:
    - A student receives an unexpected email from the financial aid office
    - A person finds a handwritten note tucked inside a library book
    - An employee is asked to stay after a routine meeting
    - A traveler hears an announcement while waiting at the gate
    - Someone recognizes a familiar ring in a secondhand shop display
    - Two friends learn they have been invited to the same interview
    - A neighbor asks to talk about using part of a shared yard
    - A person learns their mentor has made a private decision
    - An athlete is asked to discuss changing positions before practice
    - Someone opens a time capsule they do not remember burying
    - A family member asks everyone to gather for an announcement
    - A tenant receives a notice about upcoming changes to the building
  neutral_topics:
    - A clerk inventories office supplies at closing time
    - A commuter checks the stops on a familiar bus route
    - A gardener records the week's rainfall measurements
    - A librarian reshelves returned reference books
    - A cook labels containers before placing them in a refrigerator
    - A technician replaces a scheduled air filter
    - A student copies a timetable into a calendar
    - A cashier counts unopened rolls of coins
    - A hiker compares two printed trail maps
    - A tailor measures a plain curtain panel
    - A custodian unlocks rooms in a municipal building
    - A volunteer sorts forms by date

extraction:
  # The paper pools from token 50 onward. Short smoke-test stories fall back to
  # their final token rather than silently producing an empty mean.
  token_start: 50
  batch_size: 2
  neutral_variance_threshold: 0.5

gates:
  minimum_held_out_accuracy: 0.40
  minimum_held_out_macro_auc: 0.60
  minimum_mean_correct_margin: 0.0

output_dir: artifacts/prototype1
