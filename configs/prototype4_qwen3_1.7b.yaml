# 1.7B scale-up pre-registration (2026-07-10). Identical to the accepted 0.6B
# configs/prototype4.yaml except the experiment label and the Prototype 2.5
# bundle paths, which point at the registered Qwen3-1.7B-Base extraction
# (nested Prototype 1 run 20260710T225211Z__...__eb0a3670a3; model, dtype, and
# selected layer are inherited from that bundle). Scale-up caveat carried
# from the 1.7B Prototype 2.5 validation: lexical robustness at chance and zero
# intensity monotonicity (weaker semantic controls than 0.6B).
experiment: prototype4-qwen3-1.7b
seed: 42

prototype1:
  # Canonical vector source from the accepted Prototype 2.5 handoff.
  run_dir: results/runs/20260710T223434Z__prototype2-5-qwen3-1-7b__qwen-qwen3-1-7b-base__seed-42__530f4b779c/prototype1/20260710T225211Z__prototype1-prototype25__qwen-qwen3-1-7b-base__seed-42__eb0a3670a3
  emotion_vectors: emotion_vectors.safetensors

model:
  # Defaults are inherited from the Prototype 1 bundle when left unset.
  name:
  revision:
  dtype:
  device:
  local_files_only:

emotions:
  - happy
  - sad
  - angry
  - afraid

intervention:
  # If omitted, the runner uses Prototype 1's pre-registered selected layer.
  layer:
  strengths: [-4, -2, -1, 0, 1, 2, 4]
  # False means the saved vector is multiplied directly by the signed strength.
  # Set true for a stronger diagnostic where each strength is additionally
  # scaled by the selected vector norm.
  scale_by_vector_norm: false

matching_token:
  terms:
    happy: ["happy", "joyful", "pleased", "glad"]
    sad: ["sad", "sorrowful", "unhappy", "mournful"]
    angry: ["angry", "furious", "annoyed", "mad"]
    afraid: ["afraid", "scared", "fearful", "anxious"]
  prompts:
    - id: mt-happy-1
      target_emotion: happy
      text: "After reading the message, the person felt"
    - id: mt-sad-1
      target_emotion: sad
      text: "After reading the message, the person felt"
    - id: mt-angry-1
      target_emotion: angry
      text: "After reading the message, the person felt"
    - id: mt-afraid-1
      target_emotion: afraid
      text: "After reading the message, the person felt"

free_generation:
  strengths: [-8, -4, 0, 4, 8]
  max_new_tokens: 96
  do_sample: true
  temperature: 0.8
  top_p: 0.95
  samples_per_condition: 3
  seed: 271828
  terms:
    happy: ["happy", "joyful", "pleased", "glad", "smile", "smiled", "relieved", "delighted"]
    sad: ["sad", "sorrowful", "unhappy", "mournful", "cried", "tears", "lonely", "grief"]
    angry: ["angry", "furious", "annoyed", "mad", "irritated", "rage", "shouted", "glared"]
    afraid: ["afraid", "scared", "fearful", "anxious", "terrified", "panic", "trembled", "nervous"]
  prompts:
    - id: fg-happy-1
      target_emotion: happy
      text: "Avery saw everyone waiting with smiles and"
    - id: fg-happy-2
      target_emotion: happy
      text: "Avery read the note and felt"
    - id: fg-sad-1
      target_emotion: sad
      text: "Avery looked at the empty chair and"
    - id: fg-sad-2
      target_emotion: sad
      text: "Avery read the note and felt"
    - id: fg-angry-1
      target_emotion: angry
      text: "Avery saw the broken promise and"
    - id: fg-angry-2
      target_emotion: angry
      text: "Avery read the note and felt"
    - id: fg-afraid-1
      target_emotion: afraid
      text: "Avery heard the sound behind the door and"
    - id: fg-afraid-2
      target_emotion: afraid
      text: "Avery read the note and felt"

controls:
  random_seed: 314159

gates:
  zero_steering_max_abs_logit_error: 1.0e-6

output_dir: artifacts/prototype4
