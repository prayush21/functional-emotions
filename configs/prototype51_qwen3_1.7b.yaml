# 1.7B scale-up pre-registration (2026-07-10). Identical to the accepted 0.6B
# configs/prototype51.yaml except the experiment label and the Prototype 2.5
# bundle paths, which point at the registered Qwen3-1.7B-Base extraction
# (nested Prototype 1 run 20260710T225211Z__...__eb0a3670a3; model, dtype, and
# selected layer are inherited from that bundle).
# One pre-registered addition: scoring.modes includes the new
# option_text_mean_logprob_margin length-normalized diagnostic;
# option_text_logprob_margin remains the primary mode. Scale-up caveat carried
# from the 1.7B Prototype 2.5 validation: lexical robustness at chance and zero
# intensity monotonicity (weaker semantic controls than 0.6B).
experiment: prototype51-qwen3-1.7b
seed: 42

prototype1:
  # Canonical vector source from the accepted Prototype 2.5 handoff.
  run_dir: results/runs/20260710T223434Z__prototype2-5-qwen3-1-7b__qwen-qwen3-1-7b-base__seed-42__530f4b779c/prototype1/20260710T225211Z__prototype1-prototype25__qwen-qwen3-1-7b-base__seed-42__eb0a3670a3
  emotion_vectors: emotion_vectors.safetensors

model:
  # Defaults are inherited from the Prototype 1 bundle when left unset.
  name:
  revision:
  dtype:
  device:
  local_files_only:

emotions:
  - happy
  - sad
  - angry
  - afraid

intervention:
  # Compact robustness sweep around Prototype 5's selected layer 19.
  layers: [16, 17, 18, 19, 20, 21, 22]
  layer:
  strengths: [-12, -8, -4, -2, 0, 2, 4, 8, 12]
  scale_by_vector_norm: false

scoring:
  primary: option_text_logprob_margin
  modes:
    - choice_token_margin
    - option_text_logprob_margin
    - option_text_mean_logprob_margin

preference_task:
  contexts:
    - id: neutral
      family: neutral
      text: The person is deciding what to do next.
    - id: welcome-news
      family: positive_social
      text: The person just received welcome news and is deciding what to do next.
    - id: draining-disappointment
      family: loss_low_energy
      text: The person has had a draining disappointment and is deciding what to do next.
    - id: crossed-boundary
      family: conflict
      text: The person notices someone crossed a boundary and is deciding what to do next.
    - id: uncertain-sound
      family: safety_uncertainty
      text: The person hears an uncertain sound nearby and is deciding what to do next.
  expected_categories:
    happy:
      - social_connection
      - celebration_play
      - helping_generosity
      - exploration_novelty
    sad:
      - rest_withdrawal
      - reflection
      - low_energy
    angry:
      - confrontation_correction
      - boundary_setting
    afraid:
      - safety_checking
      - avoidance_caution
      - careful_review
  pairs:
    - id: social-vs-rest
      activity_a: call a friend
      category_a: social_connection
      activity_b: sit quietly alone
      category_b: rest_withdrawal
    - id: calm-ask-vs-confront
      activity_a: ask for clarification calmly
      category_a: careful_review
      activity_b: confront the person immediately
      category_b: confrontation_correction
    - id: check-door-vs-cook
      activity_a: check that the door is locked
      category_a: safety_checking
      activity_b: start cooking dinner
      category_b: routine_maintenance
    - id: celebration-vs-leave
      activity_a: join the celebration
      category_a: celebration_play
      activity_b: leave early
      category_b: avoidance_caution
    - id: write-vs-angry-reply
      activity_a: write down what happened
      category_a: reflection
      activity_b: send an angry reply
      category_b: confrontation_correction
    - id: walk-vs-bed
      activity_a: take a walk outside
      category_a: exploration_novelty
      activity_b: stay in bed
      category_b: low_energy
    - id: help-vs-ignore
      activity_a: help clean up
      category_a: helping_generosity
      activity_b: ignore the mess
      category_b: routine_maintenance
    - id: review-vs-rush
      activity_a: review the plan carefully
      category_a: careful_review
      activity_b: rush ahead
      category_b: exploration_novelty

controls:
  random_seed: 314159

gates:
  zero_steering_max_abs_logit_error: 1.0e-6
  zero_steering_max_abs_logprob_error: 1.0e-6
  kl_max_for_effect_summary: 0.25

output_dir: artifacts/prototype51
