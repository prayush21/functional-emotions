[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "functional-emotions"
version = "0.1.0"
description = "Open-weight replication experiments for functional emotion representations in language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pyyaml>=6.0,<7",
  "safetensors>=0.4,<1",
  "torch>=2.4,<3",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
cloud = ["modal>=0.73,<2"]

[project.scripts]
fe-prototype0 = "functional_emotions.prototype0:main"

[tool.hatch.build.targets.wheel]
packages = ["src/functional_emotions"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

